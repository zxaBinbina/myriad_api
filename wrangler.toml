# 万象 myriad_api · Cloudflare Worker 配置模板
#
# 除 Worker 本身外，所有绑定都是可选的：缺少某个绑定时，对应功能会自动关闭，
# 其余接口照常运行（GET /v1/health 会列出当前可用的功能）。
# 新版 wrangler 会在首次部署时自动创建未填写 id 的 D1 / KV / R2 资源。

name = "myriad-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat", "enable_request_signal"]

# 默认使用部署者的 *.workers.dev；需要时在本机配置中填写自己的域名。
workers_dev = true
# routes = [{ pattern = "myriad.example.com", custom_domain = true }]

[vars]
# 不用 Access 时，运行 npm run token:create，并按 README 把校验值作为 Secret 部署。
SYNC_IDENTITY = "owner"
# 可选 Cloudflare Access：两者留空时只使用上面的独立连接令牌。
ACCESS_TEAM_DOMAIN = ""
ACCESS_AUD = ""
# 额外的身份白名单（逗号分隔的邮箱或 Service Token 的 Client ID），留空表示只依赖 Access 策略
ALLOWED_IDENTITIES = ""
# 允许跨域访问的网页来源（逗号分隔）。浏览器扩展通过主机权限访问，不需要列在这里。
ALLOWED_ORIGINS = ""

# ---------------------------------------------------------------------------
# 可选绑定
# ---------------------------------------------------------------------------

# Workers AI：登录后的翻译（m2m100），未绑定时可用本机翻译 Key 或其他服务端 Key。
# [ai]
# binding = "AI"

# D1：同步数据（Yjs 更新与快照）、备份设置。缺少时关闭同步与备份。
[[d1_databases]]
binding = "DB"
database_name = "myriad"
migrations_dir = "migrations"

# KV：短期缓存（图标索引、节假日、每日壁纸等）。缺少时退回 Cache API。
[[kv_namespaces]]
binding = "CACHE"

# R2（可选）：启用后用于文件和备份；未启用时自动分块存入 D1，图标使用 Cache API。
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "myriad"

# 按 IP 限流（公开接口）。namespace_id 是账户内唯一的整数，随意取一个即可。
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "7301"
simple = { limit = 120, period = 60 }

# Analytics Engine：接口调用统计（可选，取消注释即可启用）
# [[analytics_engine_datasets]]
# binding = "ANALYTICS"
# dataset = "myriad_api"

# 定时任务：每天 UTC 20:00（北京时间 04:00）做备份、刷新节假日数据
[triggers]
crons = ["0 20 * * *"]

# Secrets（用 `wrangler secret put <NAME>` 设置，均为可选）：
#   SYNC_TOKEN_SHA256    独立连接令牌的 SHA-256 校验值（见 README）
#   UNSPLASH_ACCESS_KEY  Unsplash 每日壁纸
#   DEEPL_API_KEY       DeepL；Free Key 自动使用 api-free.deepl.com
#   MICROSOFT_TRANSLATOR_KEY     Microsoft Translator
#   MICROSOFT_TRANSLATOR_REGION  Microsoft Key 对应的区域（需要时）
#   QWEATHER_HOST       和风专属域名（*.qweatherapi.com）
#   QWEATHER_API_KEY    和风 API Key，或改用以下 EdDSA JWT 参数
#   QWEATHER_PRIVATE_KEY / QWEATHER_KID / QWEATHER_SUB
#   GITHUB_TOKEN        仅私有接口使用，按需要授予读取权限
